services:
  - type: web
    name: patchpilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PATCHPILOT_ENV
        value: production
      - key: PATCHPILOT_PLANNER
        value: deterministic
      - key: PATCHPILOT_DATABASE_PATH
        value: /tmp/patchpilot.db
      - key: PATCHPILOT_WORKSPACE_ROOT
        value: /tmp/workspaces
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
