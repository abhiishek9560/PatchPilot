name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic workflow and tests
        run: |
          python3 scripts/run_demo.py
          python3 -m unittest discover -s apps/api/tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q apps/api scripts

